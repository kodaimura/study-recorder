services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    working_dir: /usr/src/app
    tty: true
    environment:
      ENV: production
    command: sh -c "npm ci --no-progress && npm run build && node dist/main.js"
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3101:3101"
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    working_dir: /usr/src/app
    tty: true
    command: sh -c "npm ci --no-progress && npm run build"

volumes:
  backend_node_modules:
  frontend_node_modules:
